<div *ngIf="visible" class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <!-- Header -->
      <div
        class="modal-header text-white border-0 py-3"
        style="background-color: darkblue"
      >
        <h5 class="modal-title fw-bold mb-0">
          <i class="fas fa-users me-2"></i>
          Usuarios Responsables
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          (click)="cerrar()"
          aria-label="Cerrar"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-0">
        <app-usuario-carousel
          [usuariosIds]="usuariosIds"
        ></app-usuario-carousel>
      </div>

      <!-- Footer -->
      <div class="modal-footer bg-light border-0 py-2">
        <button type="button" class="btn btn-secondary px-4" (click)="cerrar()">
          <i class="fas fa-times me-2"></i>
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>
<div *ngIf="visible" class="modal-backdrop fade show"></div>
