<div *ngIf="visible" class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <!-- Header -->
      <div class="modal-header text-white border-0 py-3">
        <h5 class="modal-title fw-bold mb-0">
          <i class="fas fa-users me-2" style="color: #f8ae15"></i>
          {{
            mostrandoFormularioAsignacion
              ? "Asignar Nuevo Usuario"
              : "Usuarios Responsables"
          }}
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          (click)="cerrarModal()"
          aria-label="Cerrar"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <!-- Carrusel de Usuarios -->
        <div *ngIf="!mostrandoFormularioAsignacion">
          <app-usuario-carousel
            [usuariosAsignaciones]="usuariosAsignaciones"
            [usuariosCompletos]="usuariosCompletos"
            [modo]="modo"
            [desasignando]="desasignando"
            (onDesasignarUsuario)="desasignarUsuario($event)"
          ></app-usuario-carousel>
        </div>

        <!-- Formulario de Asignación (componente hijo) -->
        <app-formulario-asignar-usuario
          *ngIf="mostrandoFormularioAsignacion"
          [oidTipoActividad]="oidTipoActividadActual"
          [usuariosYaAsignados]="usuariosAsignaciones"
          (onUsuarioListo)="asignarUsuario($event)"
          (onCancelar)="cerrarFormularioAsignacion()"
        ></app-formulario-asignar-usuario>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 py-3">
        <!-- Botones cuando NO está el formulario -->
        <ng-container *ngIf="!mostrandoFormularioAsignacion">
          <button
            *ngIf="modo === 'gestionar'"
            type="button"
            class="btn btn-success px-4"
            (click)="abrirFormularioAsignacion()"
          >
            <i class="fas fa-user-plus me-2"></i>
            Asignar Usuario
          </button>

          <button
            type="button"
            class="btn btn-outline-secondary px-4"
            (click)="cerrarModal()"
          >
            <i class="fas fa-times me-2"></i>
            Cerrar
          </button>
        </ng-container>

        <!-- Loading cuando está asignando -->
        <div
          *ngIf="mostrandoFormularioAsignacion && asignando"
          class="w-100 text-center"
        >
          <div class="spinner-border spinner-border-sm me-2" role="status">
            <span class="visually-hidden">Asignando...</span>
          </div>
          <span>Asignando usuario...</span>
        </div>
      </div>
    </div>
  </div>
</div>
<div *ngIf="visible" class="modal-backdrop fade show"></div>
