<!-- Loading state -->
<div *ngIf="cargandoDatos" class="text-center py-4">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
  <p class="text-muted mt-2 mb-0 small">Cargando datos...</p>
</div>

<!-- Formulario -->
<div *ngIf="!cargandoDatos">
  <!-- Usuario -->
  <div class="mb-3">
    <label class="campo-label">
      <i class="fas fa-user"></i>
      Usuario
    </label>
    <ng-select
      [items]="usuariosDisponibles"
      bindLabel="label"
      bindValue="oid"
      [(ngModel)]="usuarioSeleccionado"
      placeholder="Seleccione un usuario"
      [clearable]="false"
      [loading]="cargandoUsuarios"
      [searchable]="true"
      notFoundText="No hay usuarios disponibles"
    >
      <!-- Template para opciones del dropdown -->
      <ng-template ng-option-tmp let-item="item">
        <span [title]="item.label">{{ item.label }}</span>
      </ng-template>

      <!-- Template para el valor seleccionado -->
      <ng-template ng-label-tmp let-item="item">
        <span [title]="item.label">{{ item.label }}</span>
      </ng-template>
    </ng-select>
  </div>

  <!-- Cargo y Horas -->
  <div class="row g-3 mb-3">
    <div class="col-md-7">
      <label class="campo-label">
        <i class="fas fa-briefcase"></i>
        Cargo
      </label>
      <ng-select
        [items]="cargosDisponibles"
        bindLabel="nombre"
        bindValue="oid"
        [(ngModel)]="cargoSeleccionado"
        placeholder="Seleccione un cargo"
        [clearable]="false"
        [loading]="cargandoCargos"
        notFoundText="No hay cargos disponibles"
      >
        <!-- Template para opciones del dropdown -->
        <ng-template ng-option-tmp let-item="item">
          <span [title]="item.nombre">{{ item.nombre }}</span>
        </ng-template>

        <!-- Template para el valor seleccionado -->
        <ng-template ng-label-tmp let-item="item">
          <span [title]="item.nombre">{{ item.nombre }}</span>
        </ng-template>
      </ng-select>
    </div>

    <div class="col-md-5">
      <label class="campo-label">
        <i class="fas fa-clock"></i>
        Horas
      </label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="horasAsignadas"
        min="0"
        max="999"
        placeholder="Ej: 8"
      />
    </div>
  </div>

  <!-- Botones -->
  <div class="d-flex justify-content-end gap-2 pt-2">
    <button type="button" class="btn btn-cancelar" (click)="cancelar()">
      <i class="fas fa-times me-2"></i>
      Cancelar
    </button>

    <button
      type="button"
      class="btn btn-confirmar"
      (click)="confirmar()"
      [disabled]="
        !usuarioSeleccionado || !cargoSeleccionado || horasAsignadas <= 0
      "
    >
      <i class="fas fa-plus me-2"></i>
      Guardar
    </button>
  </div>
</div>
