<div class="card mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h6 class="mb-0 d-flex align-items-center">
      <i class="fas fa-filter me-2" style="color: #f8ae15"></i>Filtros de
      Búsqueda
    </h6>
    <button
      type="button"
      class="btn btn-outline-secondary d-flex align-items-center"
      (click)="limpiarFiltros()"
    >
      <i class="fas fa-times"></i>
      <span class="d-none d-lg-inline ms-1">Limpiar</span>
    </button>
  </div>
  <div class="card-body">
    <div class="row g-3">
      <!-- Filtro por Calendario -->
      <div class="col-xl-3 col-lg-4 col-md-6">
        <label class="form-label fw-bold">
          <i class="fas fa-calendar me-1"></i>Calendario:
        </label>
        <ng-select
          [items]="calendariosDropdown"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filters.oidCalendario"
          [loading]="loadingCalendarios"
          [disabled]="loadingCalendarios"
          placeholder="Seleccione un calendario"
          [clearable]="false"
          notFoundText="No hay calendarios disponibles"
          loadingText="Cargando calendarios..."
        >
          <ng-template ng-label-tmp let-item="item">
            <div class="d-flex align-items-center">
              <span>{{ item.label }}</span>
              <span
                class="badge ms-2"
                [ngClass]="{
                  'badge-activo': item.estado === 'ACTIVO',
                  'badge-pendiente': item.estado === 'PENDIENTE',
                  'badge-deshabilitado': item.estado === 'DESHABILITADO',
                  'badge-aprobado': item.estado === 'APROBADO'
                }"
              >
                {{ item.estado }}
              </span>
            </div>
          </ng-template>

          <ng-template ng-option-tmp let-item="item">
            <div class="d-flex justify-content-between align-items-center">
              <span>{{ item.label }}</span>
              <span
                class="badge"
                [ngClass]="{
                  'badge-activo': item.estado === 'ACTIVO',
                  'badge-pendiente': item.estado === 'PENDIENTE',
                  'badge-deshabilitado': item.estado === 'DESHABILITADO',
                  'badge-aprobado': item.estado === 'APROBADO'
                }"
              >
                {{ item.estado }}
              </span>
            </div>
          </ng-template>
        </ng-select>
        <small class="text-muted">Filtrar por calendario académico</small>
      </div>

      <!-- Filtro por Tipo de Actividad -->
      <div class="col-xl-3 col-lg-4 col-md-6">
        <label class="form-label fw-bold">
          <i class="fas fa-tags me-1"></i>Tipo de Actividad:
        </label>
        <ng-select
          [items]="tiposActividadDropdown"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filters.oidTipoActividad"
          [loading]="loadingTiposActividad"
          [disabled]="loadingTiposActividad"
          placeholder="Seleccione un tipo"
          [clearable]="false"
          notFoundText="No hay tipos de actividad disponibles"
          loadingText="Cargando tipos..."
        >
        </ng-select>
        <small class="text-muted">Filtrar por tipo específico</small>
      </div>

      <!-- Filtro por Estado -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label class="form-label fw-bold">
          <i class="fas fa-info-circle me-1"></i>Estado:
        </label>
        <ng-select
          [items]="estadosDropdown"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filters.oidEstadoActividad"
          placeholder="Seleccione un estado"
          [clearable]="false"
          [searchable]="false"
          notFoundText="No hay estados disponibles"
        >
        </ng-select>
        <small class="text-muted">Filtrar por estado de la actividad</small>
      </div>

      <!-- Filtro por Responsable -->
      <div class="col-xl-3 col-lg-4 col-md-6">
        <label class="form-label fw-bold">
          <i class="fas fa-user me-1"></i>Responsable:
        </label>
        <ng-select
          [items]="usuariosDropdown"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filtroResponsable"
          [loading]="loadingUsuarios"
          [disabled]="loadingUsuarios || !filters.oidDepartamento"
          placeholder="Buscar responsable..."
          [clearable]="false"
          notFoundText="No se encontraron usuarios"
          loadingText="Cargando usuarios..."
          [searchable]="true"
        >
        </ng-select>
        <small class="text-muted">Filtrar por usuario responsable</small>
      </div>

      <!-- Filtro por Fecha creación (deshabilitado por ahora) -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label class="form-label fw-bold">
          <i class="fas fa-calendar-alt me-1"></i>Fecha Creación:
        </label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="filters.fechaCreacionDesde"
          disabled
        />
        <small class="text-muted">Próximamente</small>
      </div>

      <!-- Búsqueda (deshabilitada por ahora) -->
      <div class="col-xl-2 col-lg-4 col-md-6">
        <label class="form-label fw-bold">
          <i class="fas fa-search me-1"></i>Buscar:
        </label>
        <input
          type="text"
          class="form-control"
          placeholder="Buscar por nombre..."
          [(ngModel)]="filters.searchTerm"
          disabled
        />
        <small class="text-muted">Próximamente</small>
      </div>

      <!-- Botones de Acción -->
      <div class="col-xl-12 d-flex justify-content-end align-items-end">
        <div class="btn-group" role="group">
          <button
            type="button"
            class="btn btn-primary"
            (click)="aplicarFiltros()"
          >
            <i class="fas fa-search me-1"></i>Buscar
          </button>
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="recargarFiltros()"
            [disabled]="
              loadingCalendarios || loadingTiposActividad || loadingUsuarios
            "
            title="Recargar filtros"
          >
            <i
              class="fas fa-sync-alt"
              [class.fa-spin]="
                loadingCalendarios || loadingTiposActividad || loadingUsuarios
              "
            ></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
