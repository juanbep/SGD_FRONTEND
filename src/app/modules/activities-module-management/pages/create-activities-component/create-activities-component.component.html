<div class="view-container">
  
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 style="color: #000066">
      <i class="fas fa-plus-circle me-2"></i>
      Crear Nueva Actividad Académica
    </h3>
    <button class="btn btn-outline-secondary" (click)="cancelar()">
      <i class="fas fa-times me-2"></i>Cancelar
    </button>
  </div>

  <!-- Stepper Component -->
  <app-stepper
    class="mb-4"
    [pasoActual]="pasoActual()"
    [pasosCompletados]="datosWizard().stepsCompleted"
    [titulosPasos]="TITULOS_PASOS"
    (irAPaso)="irAPaso($event)"
  ></app-stepper>

  <!-- Contenido del paso actual -->
  <div class="wizard-content card shadow-sm p-4 mb-4">
    
    <!-- Paso 1: Información Básica -->
    <app-step-info-basica
      *ngIf="pasoActual() === 1"
      [datos]="datosWizard().infoBasica"
      (cambio)="alCambiarInfoBasica($event)"
      (validezCambiada)="alCambiarValidezPaso1($event)"
    ></app-step-info-basica>

    <!-- Paso 2: Detalles Temporales -->
    <div *ngIf="pasoActual() === 2" class="text-center py-5">
      <i class="fas fa-clock fa-4x text-muted mb-3"></i>
      <h5 class="text-muted">Paso 2: Detalles Temporales</h5>
      <p class="text-muted">En desarrollo...</p>
    </div>

    <!-- Paso 3: Atributos Dinámicos -->
    <div *ngIf="pasoActual() === 3" class="text-center py-5">
      <i class="fas fa-list-ul fa-4x text-muted mb-3"></i>
      <h5 class="text-muted">Paso 3: Atributos Dinámicos</h5>
      <p class="text-muted">En desarrollo...</p>
    </div>

    <!-- Paso 4: Asignar Usuarios -->
    <div *ngIf="pasoActual() === 4" class="text-center py-5">
      <i class="fas fa-users fa-4x text-muted mb-3"></i>
      <h5 class="text-muted">Paso 4: Asignar Usuarios</h5>
      <p class="text-muted">En desarrollo...</p>
    </div>

    <!-- Paso 5: Revisión y Confirmación -->
    <div *ngIf="pasoActual() === 5" class="text-center py-5">
      <i class="fas fa-check-circle fa-4x text-muted mb-3"></i>
      <h5 class="text-muted">Paso 5: Revisión y Confirmación</h5>
      <p class="text-muted">En desarrollo...</p>
    </div>

  </div>

  <!-- Footer de navegación -->
  <div class="wizard-footer d-flex justify-content-between">
    
    <!-- Botón Anterior -->
    <button
      class="btn btn-secondary"
      (click)="pasoAnterior()"
      [disabled]="esPrimerPaso()"
    >
      <i class="fas fa-arrow-left me-2"></i>
      Anterior
    </button>

    <!-- Botones del medio -->
    <div class="d-flex gap-2">
      <!-- Guardar Borrador -->
      <button 
        class="btn btn-outline-secondary" 
        (click)="guardarBorradorManual()"
      >
        <i class="fas fa-save me-2"></i>
        Guardar borrador
      </button>

      <!-- Guardar y Salir (solo paso 1) -->
      <button
        *ngIf="pasoActual() === 1"
        class="btn btn-warning"
        (click)="guardarYSalir()"
        [disabled]="!paso1Valido() || enviandoDatos()"
      >
        <i class="fas fa-check-circle me-2"></i>
        Guardar y Salir
      </button>
    </div>

    <!-- Botón Siguiente / Crear -->
    <button
      *ngIf="!esUltimoPaso()"
      class="btn btn-primary"
      (click)="siguientePaso()"
    >
      Siguiente
      <i class="fas fa-arrow-right ms-2"></i>
    </button>

    <!-- Botón Crear Actividad (último paso) -->
    <button
      *ngIf="esUltimoPaso()"
      class="btn btn-success"
      (click)="enviar()"
      [disabled]="enviandoDatos()"
    >
      <span [hidden]="enviandoDatos()">
        <i class="fas fa-check me-2"></i>
        Crear Actividad
      </span>
      <span [hidden]="!enviandoDatos()">
        <span
          class="spinner-border spinner-border-sm me-2"
          role="status"
        ></span>
        Creando...
      </span>
    </button>

  </div>

</div>
