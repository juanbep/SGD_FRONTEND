<div *ngIf="visible" class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <!-- Header -->
      <div class="modal-header border-0 py-3">
        <h5 class="modal-title fw-bold mb-0">
          <i class="fa-solid fa-download me-2" style="color: #f8ae15"></i>
          Descargar Necesidades
        </h5>
        <button
          type="button"
          class="btn-close"
          (click)="cerrar()"
          [disabled]="descargando"
          aria-label="Cerrar"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body px-4 py-3">
        <!-- Selector de Calendario con ng-select -->
        <div class="info-section">
          <label class="form-label fw-semibold">
            <i class="fas fa-calendar-alt me-2"></i>
            Calendario
            <span class="text-danger">*</span>
          </label>
          <ng-select
            [(ngModel)]="oidCalendarioSeleccionado"
            [items]="calendarios"
            bindLabel="label"
            bindValue="value"
            placeholder="Seleccione un calendario"
            [clearable]="false"
            [searchable]="true"
            [disabled]="descargando"
            notFoundText="No se encontraron calendarios"
          >
          </ng-select>
        </div>

        <!-- Selector de Departamento con ng-select (solo para roles especiales) -->
        <div class="info-section" *ngIf="rolEspecial">
          <label class="form-label fw-semibold">
            <i class="fas fa-building me-2"></i>
            Departamento
            <span class="text-danger" *ngIf="!descargarTodos">*</span>
          </label>
          <ng-select
            [(ngModel)]="oidDepartamentoSeleccionado"
            [items]="departamentos"
            bindLabel="label"
            bindValue="value"
            placeholder="Seleccione un departamento"
            [clearable]="false"
            [searchable]="true"
            [disabled]="descargando || descargarTodos"
            notFoundText="No se encontraron departamentos"
          >
          </ng-select>
        </div>

        <!-- Checkbox "Todos los departamentos" (solo para roles especiales) -->
        <div class="info-section" *ngIf="rolEspecial">
          <div class="form-check">
            <input
              class="form-check-input checkbox-hover"
              type="checkbox"
              id="descargarTodos"
              [(ngModel)]="descargarTodos"
              (change)="onDescargarTodosChange()"
              [disabled]="descargando"
            />
            <label class="form-check-label label-hover" for="descargarTodos">
              <i class="fas fa-building me-2"></i>
              Descargar necesidades de todos los departamentos
            </label>
          </div>
        </div>

        <!-- Mensaje de ayuda -->
        <div class="alert alert-info d-flex align-items-start mb-0">
          <i class="fas fa-info-circle me-2 mt-1"></i>
          <small *ngIf="!rolEspecial">
            Se descargarán las necesidades del calendario seleccionado para su
            departamento.
          </small>
          <small *ngIf="rolEspecial && !descargarTodos">
            Seleccione el calendario y el departamento para descargar las
            necesidades en formato Excel.
          </small>
          <small *ngIf="rolEspecial && descargarTodos">
            Se descargarán las necesidades de
            <strong>todos los departamentos</strong> para el calendario
            seleccionado.
          </small>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 py-3">
        <button
          type="button"
          class="btn btn-outline-secondary px-4 btn-hover"
          (click)="cerrar()"
          [disabled]="descargando"
        >
          <i class="fas fa-times me-2"></i>
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary px-4 btn-hover"
          (click)="descargarNecesidades()"
          [disabled]="descargando"
        >
          <span *ngIf="!descargando">
            <i class="fa-solid fa-download me-2"></i>
            Descargar Excel
          </span>
          <span *ngIf="descargando">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Descargando...
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
<div *ngIf="visible" class="modal-backdrop fade show"></div>
