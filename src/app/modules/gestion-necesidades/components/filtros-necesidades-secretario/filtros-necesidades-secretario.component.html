<!-- Card de Filtros -->
<div class="card mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h6 class="mb-0 d-flex align-items-center">
      <i class="fas fa-filter me-2" style="color: #f8ae15"></i>Filtros de
      Búsqueda
    </h6>
    <button
      type="button"
      class="btn btn-outline-secondary d-flex align-items-center"
      (click)="limpiarFiltros()"
      [disabled]="!hasFiltrosActivos()"
    >
      <i class="fas fa-times"></i>
      <span class="d-none d-lg-inline ms-1">Limpiar</span>
    </button>
  </div>
  <div class="card-body">
    <div class="row g-3">
      <!-- Filtro por Calendario (OBLIGATORIO) -->
      <div class="col-xl-3 col-lg-4 col-md-6">
        <label for="filtroCalendario" class="form-label fw-bold">
          <i class="fas fa-calendar-alt me-1"></i>Calendario:
          <span class="text-danger">*</span>
        </label>
        <ng-select
          id="filtroCalendario"
          [items]="calendarios"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filters.oidCalendario"
          placeholder="Seleccione calendario"
          [clearable]="false"
          [searchable]="true"
          [loading]="loadingCalendarios"
          [disabled]="loadingCalendarios"
          (change)="aplicarFiltros()"
          notFoundText="No hay calendarios disponibles"
          loadingText="Cargando calendarios..."
        >
          <ng-template ng-label-tmp let-item="item">
            <div class="d-flex align-items-center">
              <span>{{ item.label }}</span>
              <span class="badge ms-2" [ngClass]="getBadgeClass(item.estado)">
                {{ item.estado }}
              </span>
            </div>
          </ng-template>

          <ng-template ng-option-tmp let-item="item">
            <div class="d-flex justify-content-between align-items-center">
              <span>{{ item.label }}</span>
              <span class="badge" [ngClass]="getBadgeClass(item.estado)">
                {{ item.estado }}
              </span>
            </div>
          </ng-template>
        </ng-select>
        <small class="text-muted">Período académico</small>
      </div>

      <!-- Filtro por Departamento (OPCIONAL) -->
      <!-- <div class="col-xl-3 col-lg-4 col-md-6">
        <label for="filtroDepartamento" class="form-label fw-bold">
          <i class="fas fa-building me-1"></i>Departamento:
        </label>
        <ng-select
          id="filtroDepartamento"
          [items]="departamentos"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filtroDepartamento"
          placeholder="Todos"
          [clearable]="true"
          [searchable]="true"
          [loading]="loadingDepartamentos"
          [disabled]="loadingDepartamentos"
          notFoundText="No hay departamentos disponibles"
          loadingText="Cargando departamentos..."
        >
          <ng-template ng-label-tmp let-item="item">
            <span>{{ item.label }}</span>
          </ng-template>
        </ng-select>
        <small class="text-muted">Filtrar por departamento</small>
      </div> -->

      <!-- Filtro por Programa (OBLIGATORIO - NUEVO) -->
      <div class="col-xl-3 col-lg-4 col-md-6">
        <label for="filtroPrograma" class="form-label fw-bold">
          <i class="fas fa-graduation-cap me-1"></i>Programa:
          <span class="text-danger">*</span>
        </label>
        <ng-select
          id="filtroPrograma"
          [items]="programas"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filters.oidPrograma"
          placeholder="Seleccione programa"
          [clearable]="false"
          [searchable]="true"
          [loading]="loadingProgramas"
          [disabled]="loadingProgramas"
          (change)="aplicarFiltros()"
          notFoundText="No hay programas disponibles"
          loadingText="Cargando programas..."
        >
        </ng-select>
        <small class="text-muted">Programa académico</small>
      </div>

      <!-- Filtro por Estado -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label for="filtroEstado" class="form-label fw-bold">
          <i class="fas fa-flag me-1"></i>Estado:
        </label>
        <ng-select
          id="filtroEstado"
          [items]="estadosDisponibles"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filtroEstado"
          placeholder="Todos"
          [clearable]="false"
          [searchable]="false"
        >
        </ng-select>
        <small class="text-muted">Estado de la necesidad</small>
      </div>

      <!-- Filtro por Semestre -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label for="filtroSemestre" class="form-label fw-bold">
          <i class="fas fa-calendar-week me-1"></i>Semestre:
        </label>
        <ng-select
          id="filtroSemestre"
          [items]="semestresDisponibles"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filtroSemestre"
          placeholder="Todos"
          [clearable]="false"
          [searchable]="false"
        >
        </ng-select>
        <small class="text-muted">Semestre académico</small>
      </div>

      <!-- Filtro por Grupo -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label for="filtroGrupo" class="form-label fw-bold">
          <i class="fas fa-users me-1"></i>Grupo:
        </label>
        <ng-select
          id="filtroGrupo"
          [items]="gruposDisponibles"
          bindLabel="label"
          bindValue="value"
          [(ngModel)]="filtroGrupo"
          placeholder="Todos"
          [clearable]="false"
          [searchable]="false"
        >
        </ng-select>
        <small class="text-muted">Grupo A, B, C...</small>
      </div>

      <!-- Filtro por OID -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label for="filtroOid" class="form-label fw-bold">
          <i class="fas fa-key me-1"></i>OID:
        </label>
        <input
          type="text"
          id="filtroOid"
          class="form-control"
          placeholder="Buscar por OID..."
          [(ngModel)]="filtroOid"
        />
        <small class="text-muted">Identificador único</small>
      </div>

      <!-- Filtro por Código Materia-->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label for="filtroCodigo" class="form-label fw-bold">
          <i class="fas fa-barcode me-1"></i>Código:
        </label>
        <input
          type="text"
          id="filtroCodigo"
          class="form-control"
          placeholder="Ej: MAT101..."
          [(ngModel)]="filtroCodigo"
        />
        <small class="text-muted">Código de la materia</small>
      </div>

      <!-- Filtro por Nombre -->
      <div class="col-xl-3 col-lg-4 col-md-6">
        <label for="filtroNombre" class="form-label fw-bold">
          <i class="fas fa-book me-1"></i>Nombre:
        </label>
        <input
          type="text"
          id="filtroNombre"
          class="form-control"
          placeholder="Buscar por nombre..."
          [(ngModel)]="filtroNombre"
        />
        <small class="text-muted">Nombre de la materia</small>
      </div>

      <!-- Filtro por Cupo -->
      <div class="col-xl-2 col-lg-3 col-md-6">
        <label for="filtroCupo" class="form-label fw-bold">
          <i class="fas fa-user-friends me-1"></i>Cupo:
        </label>
        <input
          type="number"
          id="filtroCupo"
          class="form-control"
          placeholder="Ej: 30..."
          [(ngModel)]="filtroCupo"
          min="1"
        />
        <small class="text-muted">Capacidad del grupo</small>
      </div>
    </div>

    <!-- Botón de Búsqueda -->
    <div class="row mt-3">
      <div class="col-12 d-flex justify-content-end gap-2">
        <button
          type="button"
          class="btn btn-primary d-flex align-items-center"
          (click)="aplicarFiltros()"
        >
          <i class="fas fa-search me-2"></i>
          <span>Buscar</span>
        </button>
      </div>
    </div>
  </div>
</div>
