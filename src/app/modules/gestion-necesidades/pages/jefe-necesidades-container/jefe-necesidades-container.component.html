<div class="view-container">
  <!-- Encabezado -->
  <div class="page-header mb-4">
    <h3 class="page-title">
      <i class="fas fa-briefcase me-2"></i>
      Gestión de Necesidades - Jefe de Departamento
    </h3>
  </div>

  <!-- Pestañas Principales -->
  <nav class="tabs-principales mb-4">
    <div class="tabs-wrapper">
      <a
        class="tab-item"
        [class.active]="tabActiva === 'revision'"
        (click)="cambiarTab('revision')"
      >
        <i class="fas fa-clipboard-check me-2"></i>
        Revisión de Necesidades
      </a>
      <a
        class="tab-item"
        [class.active]="tabActiva === 'asignaciones'"
        (click)="cambiarTab('asignaciones')"
      >
        <i class="fas fa-user-check me-2"></i>
        Gestión de Asignaciones
      </a>
      <a
        class="tab-item"
        [class.active]="tabActiva === 'seleccionados'"
        (click)="cambiarTab('seleccionados')"
      >
        <i class="fas fa-user-friends me-2"></i>
        Gestión de Seleccionados
      </a>
    </div>
  </nav>

  <!-- Contenido de Tabs -->
  <div class="tab-content">
    <!-- Tab 1: Revisión de Necesidades -->
    <div
      class="tab-pane fade"
      [class.show]="tabActiva === 'revision'"
      [class.active]="tabActiva === 'revision'"
      role="tabpanel"
    >
      <app-jefe-necesidades
        [isActive]="tabActiva === 'revision'"
      ></app-jefe-necesidades>
    </div>

    <!-- Tab 2: Gestión de Asignaciones -->
    <div
      class="tab-pane fade"
      [class.show]="tabActiva === 'asignaciones'"
      [class.active]="tabActiva === 'asignaciones'"
      role="tabpanel"
    >
      <app-jefe-asignaciones
        [isActive]="tabActiva === 'asignaciones'"
      ></app-jefe-asignaciones>
    </div>

    <!-- Tab 3: Gestión de Seleccionados -->
    <div
      class="tab-pane fade"
      [class.show]="tabActiva === 'seleccionados'"
      [class.active]="tabActiva === 'seleccionados'"
      role="tabpanel"
    >
      <app-jefe-seleccionados
        [isActive]="tabActiva === 'seleccionados'"
      ></app-jefe-seleccionados>
    </div>
  </div>
</div>
