<div class="view-container">
  <!-- Título -->
  <header class="title-two d-flex justify-content-between align-items-center">
    <span>Crear Necesidades desde Plan</span>
    <button
      type="button"
      class="btn btn-outline-secondary btn-sm"
      (click)="volverALista()"
    >
      <i class="fas fa-arrow-left me-2"></i>
      Volver
    </button>
  </header>

  <!-- Mensaje informativo -->
  <section class="messages-container">
    <img
      [src]="'assets/icons/messages/necesidades-management.svg'"
      alt="Icono de necesidades"
      onerror="this.style.display='none'"
    />
    <span class="text-body-heavy">
      Seleccione el modo de creación: <strong>Individual</strong> para crear
      grupo por grupo con cupos personalizados, o <strong>En Lote</strong> para
      crear múltiples grupos con el mismo cupo de forma rápida.
    </span>
  </section>

  <div><br /></div>

  <!-- TABS DE NAVEGACIÓN -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <a
        class="nav-link"
        [class.active]="activeTab === 'individual'"
        (click)="cambiarTab('individual')"
        style="cursor: pointer"
      >
        <i class="fas fa-user me-2"></i>
        Creación Individual
      </a>
    </li>
    <li class="nav-item">
      <a
        class="nav-link"
        [class.active]="activeTab === 'lote'"
        (click)="cambiarTab('lote')"
        style="cursor: pointer"
      >
        <i class="fas fa-layer-group me-2"></i>
        Creación en Lote
      </a>
    </li>
  </ul>

  <!-- CONTENIDO SEGÚN TAB ACTIVO -->
  <div *ngIf="activeTab === 'individual'">
    <app-crear-individual
      [oidPlan]="oidPlan"
      [oidCalendario]="oidCalendario"
    ></app-crear-individual>
  </div>

  <div *ngIf="activeTab === 'lote'">
    <app-crear-lote
      [oidPlan]="oidPlan"
      [oidCalendario]="oidCalendario"
    ></app-crear-lote>
  </div>
</div>
