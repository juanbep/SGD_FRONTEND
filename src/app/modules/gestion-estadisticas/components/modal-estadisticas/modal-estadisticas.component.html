<div *ngIf="visible" class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <!-- Header -->
      <div class="modal-header border-0 py-3">
        <h5 class="modal-title fw-bold mb-0">
          <i class="fas fa-chart-bar me-2" style="color: #f8ae15"></i>
          Generar Estadísticas
        </h5>
        <button
          type="button"
          class="btn-close"
          (click)="cerrar()"
          [disabled]="generando"
          aria-label="Cerrar"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body px-4 py-3">
        <!-- Selector de Calendario -->
        <div class="mb-4">
          <label class="form-label fw-semibold">
            <i class="fas fa-calendar-alt me-2"></i>
            Calendario
            <span class="text-danger">*</span>
          </label>
          <select
            class="form-select"
            [(ngModel)]="oidCalendarioSeleccionado"
            [disabled]="generando"
          >
            <option [ngValue]="null">Seleccione un calendario</option>
            <option
              *ngFor="let calendario of calendarios"
              [ngValue]="calendario.value"
            >
              {{ calendario.label }}
            </option>
          </select>
        </div>

        <!-- Checkboxes de Gráficos -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <label class="form-label fw-semibold mb-0">
              <i class="fas fa-chart-line me-2"></i>
              Gráficos a incluir
              <span class="text-danger">*</span>
            </label>
            <button
              type="button"
              class="btn btn-sm btn-outline-secondary"
              (click)="toggleTodas()"
              [disabled]="generando"
            >
              <i
                [class.fa-check-square]="todasSeleccionadas"
                [class.fa-square]="!todasSeleccionadas"
                class="fas me-1"
              ></i>
              {{
                todasSeleccionadas ? "Deseleccionar todas" : "Seleccionar todas"
              }}
            </button>
          </div>

          <div class="graficos-container">
            <div
              *ngFor="let grafico of graficos"
              class="form-check grafico-item"
            >
              <input
                class="form-check-input"
                type="checkbox"
                [id]="grafico.valor"
                [(ngModel)]="grafico.seleccionado"
                [disabled]="generando"
              />
              <label class="form-check-label" [for]="grafico.valor">
                {{ grafico.label }}
              </label>
            </div>
          </div>
        </div>

        <!-- Mensaje de ayuda -->
        <div class="alert alert-info d-flex align-items-start mb-0">
          <i class="fas fa-info-circle me-2 mt-1"></i>
          <small>
            Seleccione el calendario y los gráficos que desea incluir en el
            reporte PDF. Debe seleccionar al menos un gráfico.
          </small>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 py-3">
        <button
          type="button"
          class="btn btn-outline-secondary px-4"
          (click)="cerrar()"
          [disabled]="generando"
        >
          <i class="fas fa-times me-2"></i>
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary px-4"
          (click)="generarEstadisticas()"
          [disabled]="generando"
        >
          <span *ngIf="!generando">
            <i class="fas fa-file-pdf me-2"></i>
            Generar Estadísticas
          </span>
          <span *ngIf="generando">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Generando...
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
<div *ngIf="visible" class="modal-backdrop fade show"></div>
