<div *ngIf="visible" class="modal fade show d-block" tabindex="-1">
  <div
    class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"
  >
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas {{ modoEdicion() ? 'fa-edit' : 'fa-plus' }} me-2"></i>
          {{ modoEdicion() ? "Editar" : "Agregar" }} {{ metadata.nombreTipo }}
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          (click)="cancelar()"
        ></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="actividadForm">
          <!-- Nombre Actividad -->
          <div class="mb-3">
            <label class="form-label fw-bold">
              <i class="fas fa-tag me-2"></i>
              Nombre de la Actividad *
            </label>
            <input
              type="text"
              class="form-control"
              formControlName="nombreActividad"
              placeholder="Ej: Trabajo de Grado - Análisis de Sistemas"
              [class.is-invalid]="
                getControl('nombreActividad')?.invalid &&
                getControl('nombreActividad')?.touched
              "
            />
            <div
              class="invalid-feedback"
              *ngIf="
                getControl('nombreActividad')?.invalid &&
                getControl('nombreActividad')?.touched
              "
            >
              <span *ngIf="getControl('nombreActividad')?.errors?.['required']">
                El nombre es requerido
              </span>
              <span
                *ngIf="getControl('nombreActividad')?.errors?.['minlength']"
              >
                El nombre debe tener al menos 3 caracteres
              </span>
            </div>
          </div>

          <!-- Semanas -->
          <div class="mb-3">
            <label class="form-label fw-bold">
              <i class="fas fa-calendar-week me-2"></i>
              Semanas *
            </label>
            <input
              type="number"
              class="form-control"
              formControlName="semanas"
              placeholder="16"
              [class.is-invalid]="
                getControl('semanas')?.invalid && getControl('semanas')?.touched
              "
            />
            <div
              class="invalid-feedback"
              *ngIf="
                getControl('semanas')?.invalid && getControl('semanas')?.touched
              "
            >
              Debe ingresar un número válido de semanas
            </div>
          </div>

          <!-- Estado CON NG-SELECT -->
          <div class="mb-3">
            <label class="form-label fw-bold">
              <i class="fas fa-toggle-on me-2"></i>
              Estado *
            </label>
            <ng-select
              [items]="estadosActividad"
              bindLabel="label"
              bindValue="value"
              formControlName="oidEstadoActividad"
              [clearable]="false"
              [searchable]="false"
              placeholder="Seleccione estado"
            >
            </ng-select>
          </div>

          <hr class="my-4" />

          <!-- Sección de Usuarios -->
          <h6 class="mb-3 text-muted">
            <i class="fas fa-users me-2"></i>
            Asignar Usuario
          </h6>

          <!-- Usuario CON NG-SELECT -->
          <div class="row mb-3">
            <div class="col-12">
              <label class="form-label fw-bold">
                <i class="fas fa-user me-2"></i>
                Usuario
              </label>
              <ng-select
                [items]="usuariosDisponibles()"
                bindLabel="label"
                bindValue="oid"
                [(ngModel)]="usuarioSeleccionado"
                [ngModelOptions]="{ standalone: true }"
                [clearable]="true"
                [searchable]="true"
                placeholder="Seleccione usuario"
                [loading]="cargandoUsuarios()"
                notFoundText="No se encontraron usuarios"
              >
              </ng-select>
            </div>
          </div>

          <!-- Cargo y Horas CON NG-SELECT -->
          <div class="row mb-3">
            <div class="col-md-8">
              <label class="form-label fw-bold">
                <i class="fas fa-briefcase me-2"></i>
                Cargo
              </label>
              <ng-select
                [items]="cargosDisponibles()"
                bindLabel="nombre"
                bindValue="oid"
                [ngModel]="cargoSeleccionado()"
                (ngModelChange)="cargoSeleccionado.set($event)"
                [ngModelOptions]="{ standalone: true }"
                [clearable]="true"
                [searchable]="true"
                placeholder="Seleccione cargo"
                [loading]="cargandoCargos()"
                notFoundText="No se encontraron cargos"
              >
              </ng-select>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-bold">
                <i class="fas fa-clock me-2"></i>
                Horas
              </label>
              <input
                type="number"
                class="form-control"
                [(ngModel)]="horasUsuario"
                [ngModelOptions]="{ standalone: true }"
                placeholder="Ej: 8"
                min="1"
              />
            </div>
          </div>

          <!-- Botón Agregar Usuario -->
          <div class="mb-3">
            <button
              type="button"
              class="btn btn-sm btn-outline-primary"
              (click)="agregarUsuario()"
              [disabled]="
                !usuarioSeleccionado || !cargoSeleccionado() || !horasUsuario
              "
            >
              <i class="fas fa-plus me-1"></i>
              Agregar Usuario
            </button>

            <span *ngIf="contadorUsuarios()" class="ms-3 badge bg-success">
              <i class="fas fa-check-circle me-1"></i>
              {{ contadorUsuarios() }}
            </span>
          </div>

          <hr class="my-4" />

          <!-- Atributos Dinámicos -->
          <h6 class="mb-3 text-muted">
            <i class="fas fa-info-circle me-2"></i>
            Información Específica
          </h6>

          <div *ngFor="let atributo of metadata.atributos" class="mb-3">
            <label class="form-label fw-bold">
              <i class="fas fa-pen me-2"></i>
              {{ atributo.label }} {{ atributo.requerido ? "*" : "" }}
            </label>

            <!-- Input de texto -->
            <input
              *ngIf="atributo.tipoCampo === 'text'"
              type="text"
              class="form-control"
              [formControlName]="atributo.nombre"
              [placeholder]="atributo.placeholder || ''"
              [class.is-invalid]="
                getControl(atributo.nombre)?.invalid &&
                getControl(atributo.nombre)?.touched
              "
            />

            <!-- Input de número entero -->
            <input
              *ngIf="atributo.tipoCampo === 'number'"
              type="number"
              class="form-control"
              [formControlName]="atributo.nombre"
              [placeholder]="atributo.placeholder || ''"
              [class.is-invalid]="
                getControl(atributo.nombre)?.invalid &&
                getControl(atributo.nombre)?.touched
              "
            />

            <!-- Input de número decimal -->
            <input
              *ngIf="atributo.tipoCampo === 'decimal'"
              type="number"
              class="form-control"
              [formControlName]="atributo.nombre"
              [placeholder]="atributo.placeholder || ''"
              step="0.1"
              [class.is-invalid]="
                getControl(atributo.nombre)?.invalid &&
                getControl(atributo.nombre)?.touched
              "
            />

            <!-- Input de fecha -->
            <input
              *ngIf="atributo.tipoCampo === 'date'"
              type="date"
              class="form-control"
              [formControlName]="atributo.nombre"
              [class.is-invalid]="
                getControl(atributo.nombre)?.invalid &&
                getControl(atributo.nombre)?.touched
              "
            />

            <!-- Select CON NG-SELECT -->
            <ng-select
              *ngIf="atributo.tipoCampo === 'select'"
              [items]="atributo.opcionesSelect?.estatico || []"
              bindLabel="label"
              bindValue="value"
              [formControlName]="atributo.nombre"
              [clearable]="!atributo.requerido"
              [searchable]="true"
              placeholder="Seleccione una opción"
            >
            </ng-select>

            <!-- Textarea -->
            <textarea
              *ngIf="atributo.tipoCampo === 'textarea'"
              class="form-control"
              [formControlName]="atributo.nombre"
              [placeholder]="atributo.placeholder || ''"
              rows="3"
              [class.is-invalid]="
                getControl(atributo.nombre)?.invalid &&
                getControl(atributo.nombre)?.touched
              "
            ></textarea>

            <div
              class="invalid-feedback"
              *ngIf="
                getControl(atributo.nombre)?.invalid &&
                getControl(atributo.nombre)?.touched
              "
            >
              Este campo es requerido
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <div class="form-check me-auto" *ngIf="!modoEdicion()">
          <input
            class="form-check-input"
            type="checkbox"
            id="agregarOtra"
            [checked]="agregarOtra()"
            (change)="agregarOtra.set($any($event.target).checked)"
          />
          <label class="form-check-label" for="agregarOtra">
            Agregar otra después de guardar
          </label>
        </div>

        <button type="button" class="btn btn-secondary" (click)="cancelar()">
          <i class="fas fa-times me-2"></i>
          Cancelar
        </button>

        <button
          type="button"
          class="btn btn-primary"
          [disabled]="actividadForm.invalid"
          (click)="confirmar()"
        >
          <i class="fas {{ modoEdicion() ? 'fa-save' : 'fa-plus' }} me-2"></i>
          {{ modoEdicion() ? "Actualizar" : "Agregar" }}
        </button>
      </div>
    </div>
  </div>
</div>
<div *ngIf="visible" class="modal-backdrop fade show"></div>
