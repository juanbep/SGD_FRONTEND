<form [formGroup]="calendarForm" (ngSubmit)="onSubmit()">

  <!-- ===== Fechas RESALTADAS ===== -->
  <section>
    <header class="title-three">Fechas resaltadas</header>
    <div formArrayName="eventosResaltados">
      <table class="table-bordered">
        <thead>
          <tr>
            <th class="text-body-heavy">Evento</th>
            <th class="text-body-heavy">Fecha inicio</th>
            <th class="text-body-heavy">Fecha fin</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let g of eventosResaltados.controls; let i = index" [formGroupName]="i">
            <td [class.text-body-heavy]="FECHAS_RESALTADAS[i]?.destacado">
              {{ FECHAS_RESALTADAS[i].titulo }}
            </td>
            <td><input type="date" formControlName="fechaInicio" /></td>
            <td><input type="date" formControlName="fechaFin" /></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <div class="mb-3"></div>

  <!-- ===== Botón para NO RESALTADAS ===== -->
  <section>
    <header class="title-three">Fechas no resaltadas</header>

    <div class="mb-2">
      <button type="button"
              class="button-normal-large"
              (click)="openModalNoResaltadas()"
              [disabled]="opcionesNoResaltadas.length === 0">
        Agregar fecha
      </button>
    </div>

    <div formArrayName="eventosNoResaltados">
      <table class="table-bordered" *ngIf="eventosNoResaltados.length > 0">
        <thead>
          <tr>
            <th class="text-body-heavy">Evento</th>
            <th class="text-body-heavy">Fecha inicio</th>
            <th class="text-body-heavy">Fecha fin</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let g of eventosNoResaltados.controls; let i = index" [formGroupName]="i">
            <td>{{ g.get('titulo')?.value }}</td>
            <td><input type="date" formControlName="fechaInicio" /></td>
            <td><input type="date" formControlName="fechaFin" /></td>
            <td>
              <i class="fas fa-trash text-danger" style="cursor:pointer" (click)="removeNoResaltada(i)"></i>
            </td>
          </tr>
        </tbody>
      </table>
      <div *ngIf="eventosNoResaltados.length === 0" class="text-body-regular">
        No has agregado fechas no resaltadas.
      </div>
    </div>
  </section>

  <div class="mb-3"></div>

  <button type="submit" class="button-normal-large">Guardar calendario</button>
</form>

<!-- ======= MODAL ======= -->
<div class="modal-overlay" *ngIf="modalOpen">
  <div class="modal-card">
    <header class="title-three">Agregar fecha no resaltada</header>

    <div [formGroup]="modalForm">
      <label class="text-body-heavy">Evento</label>
      <select class="form-control" formControlName="metaId">
        <option [ngValue]="null" disabled>Seleccione un evento</option>
        <option *ngFor="let opt of opcionesNoResaltadas" [ngValue]="opt.id">
          {{ opt.titulo }}
        </option>
      </select>

      <div class="mb-2"></div>

      <label class="text-body-heavy">Fecha inicio</label>
      <input type="date" class="form-control" formControlName="fechaInicio" />

      <label class="text-body-heavy">Fecha fin (opcional)</label>
      <input type="date" class="form-control" formControlName="fechaFin" />
    </div>

    <div class="mt-3 d-flex justify-content-end">
      <button type="button" class="btn btn-secondary mx-1" (click)="closeModalNoResaltadas()">Cancelar</button>
      <button type="button" class="button-normal-large" (click)="addNoResaltadaFromModal()">Agregar</button>
    </div>
  </div>
</div>
