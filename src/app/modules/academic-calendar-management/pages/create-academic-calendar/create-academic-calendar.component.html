<div class="view-container">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 style="color: #000066">
      <i class="fas fa-calendar-plus me-2"></i>
      Crear Nuevo Calendario Académico
    </h3>
    <button class="btn btn-outline-secondary" (click)="cancel()">
      <i class="fas fa-times me-2"></i>Cancelar
    </button>
  </div>

  <!-- Stepper Component -->
  <app-stepper
    class="mb-4"
    [pasoActual]="pasoActual()"
    [pasosCompletados]="datosWizard().stepsCompleted"
    [titulosPasos]="TITULOS_PASOS"
    (irAPaso)="irAPaso($event)"
  ></app-stepper>

  <!-- Contenido del paso actual -->
  <div class="wizard-content card shadow-sm p-4 mb-4">
    <!-- Paso 1: Información Básica -->
    <app-step-info-basica
      *ngIf="pasoActual() === 1"
      [datosIniciales]="datosWizard().infoBasica"
      (cambioFormulario)="alCambiarInfoBasica($event)"
      (formularioValido)="alCambiarValidezPaso1($event)"
      (crearCalendario)="alCrearCalendarioPaso1($event)"
    ></app-step-info-basica>

    <!-- Paso 2: Configuración Académica -->
    <app-step-config-academica
      *ngIf="pasoActual() === 2"
      [datosIniciales]="datosWizard().configAcademica"
      (cambioFormulario)="alCambiarConfigAcademica($event)"
      (formularioValido)="alCambiarValidezPaso2($event)"
    ></app-step-config-academica>

    <!-- Paso 3: Fechas -->
    <app-step-fechas
      *ngIf="pasoActual() === 3"
      [fechasIniciales]="datosWizard().fechas"
      (cambioFechas)="alCambiarFechas($event)"
      (formularioValido)="alCambiarValidezPaso3($event)"
    ></app-step-fechas>

    <!-- Paso 4: Revisión -->
    <app-step-revision
      *ngIf="pasoActual() === 4"
      [datosWizard]="datosWizard()"
      [catalogoNombresFecha]="catalogoNombresFecha()"
    ></app-step-revision>
  </div>

  <!-- Footer de navegación -->
  <div class="wizard-footer d-flex justify-content-between">
    <button
      class="btn btn-secondary"
      (click)="pasoAnterior()"
      [disabled]="esPrimerPaso()"
    >
      <i class="fas fa-arrow-left me-2"></i>
      Anterior
    </button>

    <!-- NUEVO: Botón "Crear Calendario" (solo visible en paso 1) -->
    <button
      *ngIf="pasoActual() === 1"
      class="btn btn-success"
      (click)="
        alCrearCalendarioPaso1(stepInfoBasica.obtenerDatosParaCreacion())
      "
      [disabled]="
        !paso1Valido() || creandoCalendario() || oidCalendarioCreado() !== null
      "
    >
      <span [hidden]="creandoCalendario()">
        <i class="fas fa-check-circle me-2"></i>
        {{
          oidCalendarioCreado() !== null
            ? "Calendario Creado ✓"
            : "Crear Calendario"
        }}
      </span>
      <span [hidden]="!creandoCalendario()">
        <span
          class="spinner-border spinner-border-sm me-2"
          role="status"
        ></span>
        Creando...
      </span>
    </button>

    <!-- Botón "Siguiente" (deshabilitado en paso 1 hasta que se cree el calendario) -->
    <button
      *ngIf="!esUltimoPaso()"
      class="btn btn-primary"
      (click)="siguientePaso()"
      [disabled]="pasoActual() === 1 && !puedeAvanzarPaso1()"
    >
      Siguiente
      <i class="fas fa-arrow-right ms-2"></i>
    </button>

    <!-- Enviar Datos (paso 4) -->
    <button
      *ngIf="esUltimoPaso()"
      class="btn btn-success"
      (click)="enviar()"
      [disabled]="enviandoDatos()"
    >
      <span [hidden]="enviandoDatos()">
        <i class="fas fa-check me-2"></i>
        Finalizar
      </span>
      <span [hidden]="!enviandoDatos()">
        <span
          class="spinner-border spinner-border-sm me-2"
          role="status"
        ></span>
        Finalizando...
      </span>
    </button>
  </div>
</div>
