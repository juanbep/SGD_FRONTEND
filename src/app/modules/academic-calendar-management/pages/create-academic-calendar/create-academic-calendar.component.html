<div class="view-container">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 style="color: #000066">
      <i class="fas fa-calendar-plus me-2"></i>
      Crear Nuevo Calendario Académico
    </h3>
    <button class="btn btn-outline-secondary" (click)="cancel()">
      <i class="fas fa-times me-2"></i>Cancelar
    </button>
  </div>

  <!-- Stepper Component -->
  <app-stepper
    class="mb-4"
    [pasoActual]="pasoActual()"
    [pasosCompletados]="datosWizard().stepsCompleted"
    [titulosPasos]="TITULOS_PASOS"
    (irAPaso)="irAPaso($event)"
  ></app-stepper>

  <!-- Contenido del paso actual -->
  <div class="wizard-content card shadow-sm p-4 mb-4">
    <!-- Paso 1: Información Básica -->
    <app-step-info-basica
      *ngIf="pasoActual() === 1"
      [datosIniciales]="datosWizard().infoBasica"
      (cambioFormulario)="alCambiarInfoBasica($event)"
      (formularioValido)="alCambiarValidezPaso1($event)"
    ></app-step-info-basica>

    <!-- Paso 2: TODO -->
    <div *ngIf="pasoActual() === 2">
      <h5>Paso 2: Configuración Académica (próximamente)</h5>
    </div>

    <!-- Paso 3: TODO -->
    <div *ngIf="pasoActual() === 3">
      <h5>Paso 3: Fechas del Calendario (próximamente)</h5>
    </div>

    <!-- Paso 4: TODO -->
    <div *ngIf="pasoActual() === 4">
      <h5>Paso 4: Revisión y Confirmación (próximamente)</h5>
    </div>
  </div>

  <!-- Footer de navegación -->
  <div class="wizard-footer d-flex justify-content-between">
    <button
      class="btn btn-secondary"
      (click)="pasoAnterior()"
      [disabled]="esPrimerPaso()"
    >
      <i class="fas fa-arrow-left me-2"></i>
      Anterior
    </button>

    <button class="btn btn-outline-secondary" (click)="guardarBorrador()">
      <i class="fas fa-save me-2"></i>
      Guardar borrador
    </button>

    <button
      *ngIf="!esUltimoPaso()"
      class="btn btn-primary"
      (click)="siguientePaso()"
    >
      Siguiente
      <i class="fas fa-arrow-right ms-2"></i>
    </button>

    <button *ngIf="esUltimoPaso()" class="btn btn-success" (click)="submit()">
      <i class="fas fa-check me-2"></i>
      Crear Calendario
    </button>
  </div>
</div>
