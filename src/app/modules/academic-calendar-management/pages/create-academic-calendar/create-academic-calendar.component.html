<div class="view-container">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 style="color: #000066">
      <i class="fas fa-calendar-plus me-2"></i>
      Crear Nuevo Calendario Académico
    </h3>
    <button class="btn btn-outline-secondary" (click)="cancel()">
      <i class="fas fa-times me-2"></i>Cancelar
    </button>
  </div>

  <!-- Stepper Component -->
  <app-stepper
    class="mb-4"
    [pasoActual]="pasoActual()"
    [pasosCompletados]="pasosCompletados()"
    [titulosPasos]="TITULOS_PASOS"
    (irAPaso)="irAPaso($event)"
  ></app-stepper>

  <!-- Contenido del paso actual -->
  <div class="wizard-content card shadow-sm p-4 mb-4">
    <!-- Paso 1: Información Básica -->
    <app-step-info-basica
      *ngIf="pasoActual() === 1"
      [datosIniciales]="datosCalendarioCreado()"
      [calendarioYaCreado]="calendarioYaCreado()"
      (formularioValido)="alCambiarValidezPaso1($event)"
    ></app-step-info-basica>

    <!-- Paso 2: TODO - Construir desde cero -->
    <div *ngIf="pasoActual() === 2" class="text-center py-5">
      <i class="fas fa-calendar-alt fa-3x text-muted mb-3"></i>
      <h5 class="text-muted">Paso 2: Fechas del Calendario</h5>
      <p class="text-muted">Este paso se construirá próximamente</p>
      <p class="text-muted">
        <strong>OID del calendario:</strong> {{ oidCalendarioCreado() }}
      </p>
    </div>
  </div>

  <!-- Footer de navegación -->
  <div class="wizard-footer d-flex justify-content-between">
    <button
      class="btn btn-secondary"
      (click)="pasoAnterior()"
      [disabled]="pasoActual() === 1"
    >
      <i class="fas fa-arrow-left me-2"></i>
      Anterior
    </button>

    <!-- Botón "Crear Calendario" (solo visible en paso 1) -->
    <button
      *ngIf="pasoActual() === 1"
      class="btn btn-success"
      (click)="
        alCrearCalendarioPaso1(stepInfoBasica.obtenerDatosParaCreacion())
      "
      [disabled]="
        !paso1Valido() || creandoCalendario() || oidCalendarioCreado() !== null
      "
    >
      <span [hidden]="creandoCalendario()">
        <i class="fas fa-check-circle me-2"></i>
        {{
          oidCalendarioCreado() !== null
            ? "Calendario Creado ✓"
            : "Crear Calendario"
        }}
      </span>
      <span [hidden]="!creandoCalendario()">
        <span
          class="spinner-border spinner-border-sm me-2"
          role="status"
        ></span>
        Creando...
      </span>
    </button>

    <!-- Botón "Siguiente" -->
    <button
      *ngIf="pasoActual() < 2"
      class="btn btn-primary"
      (click)="siguientePaso()"
      [disabled]="pasoActual() === 1 && !puedeAvanzarPaso1()"
    >
      Siguiente
      <i class="fas fa-arrow-right ms-2"></i>
    </button>

    <!-- Placeholder para botón final (paso 2) -->
    <button *ngIf="pasoActual() === 2" class="btn btn-success" disabled>
      <i class="fas fa-check me-2"></i>
      Finalizar (próximamente)
    </button>
  </div>
</div>
