<div *ngIf="visible && actividad" class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <!-- Header azul -->
      <div class="modal-header text-white border-0 py-3">
        <h5 class="modal-title fw-bold mb-0">
          <i class="fas fa-edit me-2" style="color: #f8ae15"></i>
          Editar Actividad
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          (click)="cerrar()"
          aria-label="Cerrar"
        ></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-4">
        <form [formGroup]="form">
          <div class="info-section mb-4">
            <h6 class="section-title mb-3">
              <i class="fas fa-info-circle me-2"></i>
              Información General
            </h6>

            <div class="row g-3">
              <!-- Nombre -->
              <div class="col-12">
                <label class="info-label">Nombre *</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="nombreActividad"
                />
              </div>

              <!-- Tipo de actividad (SOLO LECTURA) -->
              <div class="col-md-6">
                <label class="info-label">Tipo de actividad</label>
                <input
                  type="text"
                  class="form-control"
                  [value]="actividad.actividad.tipoActividad.nombre"
                  readonly
                  disabled
                />
              </div>

              <!-- Calendario (SOLO LECTURA) -->
              <div class="col-md-6">
                <label class="info-label">Calendario</label>
                <input
                  type="text"
                  class="form-control"
                  [value]="actividad.nombreCalendario"
                  readonly
                  disabled
                />
              </div>

              <!-- Estado -->
              <div class="col-md-6">
                <label class="info-label">Estado *</label>
                <ng-select
                  [items]="estadosDropdown"
                  bindLabel="label"
                  bindValue="value"
                  formControlName="oidEstadoActividad"
                  [clearable]="false"
                  placeholder="Seleccione..."
                >
                </ng-select>
              </div>

              <!-- Semanas -->
              <div class="col-md-6">
                <label class="info-label">Semanas *</label>
                <input
                  type="number"
                  class="form-control"
                  formControlName="semanas"
                  min="1"
                />
              </div>
            </div>
          </div>

          <!-- Información adicional (atributos) -->
          <div class="info-section" formArrayName="atributos">
            <h6 class="section-title mb-3">
              <i class="fas fa-list-ul me-2"></i>
              Información adicional
            </h6>

            <div
              class="row g-3"
              *ngFor="let attr of atributosArray.controls; let i = index"
              [formGroupName]="i"
            >
              <div class="col-md-4">
                <label class="info-label">Atributo</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="nombre"
                  readonly
                />
              </div>
              <div class="col-md-8">
                <label class="info-label">Valor</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="valor"
                />
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 py-3">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="cerrar()"
        >
          <i class="fas fa-times me-2"></i>
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="guardar()"
          [disabled]="form.invalid"
        >
          <i class="fas fa-save me-2"></i>
          Guardar cambios
        </button>
      </div>
    </div>
  </div>
</div>
<div *ngIf="visible && actividad" class="modal-backdrop fade show"></div>
