<div class="container-fluid py-4 px-0">
  <!-- Proyección de contenido personalizado (mensajes, headers, etc.) -->
  <ng-content select="[header-content]"></ng-content>

  <!-- TABS NAVIGATION -->
  <nav class="tabs-principales mb-4">
    <div class="tabs-wrapper">
      <a
        class="tab-item"
        [class.active]="isTabActiva('generales')"
        (click)="cambiarTab('generales')"
      >
        <i class="fas fa-tasks me-2"></i>
        Actividades Generales
      </a>
      <a
        *ngIf="modo === 'visualizar'"
        class="tab-item"
        [class.active]="isTabActiva('docencia')"
        (click)="cambiarTab('docencia')"
      >
        <i class="fas fa-chalkboard-teacher me-2"></i>
        Actividades de Docencia
      </a>
    </div>
  </nav>

  <!-- TABS CONTENT -->
  <div class="tab-content">
    <!-- TAB 1: ACTIVIDADES GENERALES -->
    <div
      class="tab-pane fade"
      [class.show]="isTabActiva('generales')"
      [class.active]="isTabActiva('generales')"
      role="tabpanel"
    >
      <app-tabla-actividades-academicas
        #tablaGenerales
        *ngIf="isTabActiva('generales')"
        [modo]="modo"
        (onEditar)="handleEditar($event)"
        (onEliminar)="handleEliminar($event)"
      ></app-tabla-actividades-academicas>
    </div>

    <!-- TAB 2: ACTIVIDADES DOCENCIA -->
    <div
      class="tab-pane fade"
      [class.show]="isTabActiva('docencia')"
      [class.active]="isTabActiva('docencia')"
      role="tabpanel"
    >
      <app-tabla-actividades-docencia
        #tablaDocencia
        *ngIf="isTabActiva('docencia')"
        [modo]="modo"
        (onEditar)="handleEditar($event)"
        (onEliminar)="handleEliminar($event)"
      ></app-tabla-actividades-docencia>
    </div>
  </div>
</div>
