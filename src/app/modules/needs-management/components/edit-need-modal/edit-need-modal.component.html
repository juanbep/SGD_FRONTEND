<div class="modal fade" [class.show]="visible()" [style.display]="visible() ? 'block' : 'none'" tabindex="-1"
    aria-hidden="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Necesidad</h5>
                <button type="button" class="btn-close" aria-label="Cerrar" (click)="onCerrar()"></button>
            </div>

            <div class="modal-body">
                <form [formGroup]="editForm">
                    <div class="mb-3">
                        <label for="grupo" class="form-label">Grupo</label>
                        <input id="grupo" type="text" class="form-control" formControlName="grupo" />
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label for="cupo" class="form-label">Cupo</label>
                            <input id="cupo" type="number" class="form-control" formControlName="cupo" />
                        </div>
                        <div class="col-6">
                            <label for="horasSemanales" class="form-label">Horas Semanales</label>
                            <input id="horasSemanales" type="number" class="form-control"
                                formControlName="horasSemanales" />
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="onCerrar()">Cancelar</button>
                <button type="button" class="btn btn-primary" (click)="onGuardar()">Aceptar</button>
            </div>
        </div>
    </div>
</div>

@if (visible()) {
    <div class="modal-backdrop fade show"></div>
}
