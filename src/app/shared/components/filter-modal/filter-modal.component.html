<div
  class="modal fade"
  [class.show]="visible"
  [style.display]="visible ? 'block' : 'none'"
  tabindex="-1"
  [attr.aria-hidden]="!visible"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <!-- Body -->
      <div class="modal-body pt-2 px-4 pb-4">
        <form [formGroup]="formulario">
          <!-- Nombre: ocupa toda la fila -->
          @if (formulario.get('nombre')) {
          <div class="mb-3">
            <label for="nombre" class="form-label mb-2">Nombre</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              formControlName="nombre"
              placeholder=""
            />
          </div>
          }

          <!-- Semestre y Código: en grid de 2 columnas -->
          <div class="row g-3">
            @if (formulario.get('semestre')) {
            <div class="col-6">
              <label for="semestre" class="form-label mb-2">Semestre</label>
              <select
                class="form-select"
                id="semestre"
                formControlName="semestre"
              >
                <option value="">1</option>
                @for (campo of campos; track campo.nombre) { @if (campo.nombre
                === 'semestre' && campo.opciones) { @for (opcion of
                campo.opciones; track opcion.valor) {
                <option [value]="opcion.valor">{{ opcion.etiqueta }}</option>
                } } }
              </select>
            </div>
            } @if (formulario.get('codigo')) {
            <div class="col-6">
              <label for="codigo" class="form-label mb-2">Código</label>
              <input
                type="text"
                class="form-control"
                id="codigo"
                formControlName="codigo"
                placeholder=""
              />
            </div>
            }
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 pt-0 px-4 pb-4">
        <button type="button" class="btn btn-secondary" (click)="cerrarModal()">
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="aplicarFiltros()"
        >
          Aplicar Filtros
        </button>
      </div>
    </div>
  </div>
</div>

@if (visible) {
<div class="modal-backdrop fade show"></div>
}
